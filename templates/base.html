<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>{% block title %}Employee Portal{% endblock %}</title>
<style>
  /* ============================================================
     Design tokens
     ============================================================ */
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --card: rgba(255, 255, 255, 0.97);
    --text: #0f172a;
    --text-soft: #64748b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-strong: #4f46e5;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --radius: 16px;
    --shadow-lg: 0 24px 60px -16px rgba(2, 6, 23, 0.45);
    --shadow-sm: 0 1px 3px rgba(2, 6, 23, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 12% -8%,  rgba(99, 102, 241, 0.35),  transparent 60%),
      radial-gradient(800px 500px at 95% 10%,  rgba(139, 92, 246, 0.30),  transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(56, 189, 248, 0.22),  transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
  }

  .container {
    max-width: 460px;
    margin: 48px auto;
    padding: 0 20px;
  }
  .container.wide { max-width: 640px; }

  /* ============================================================
     Brand
     ============================================================ */
  .brand {
    display: flex; align-items: center; gap: 12px;
    justify-content: center;
    color: #e2e8f0; margin-bottom: 20px;
    font-weight: 600; letter-spacing: 0.3px;
  }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 17px;
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.7);
  }

  /* ============================================================
     Cards
     ============================================================ */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: var(--shadow-lg);
    padding: 32px;
    animation: rise .45s cubic-bezier(.21,.8,.35,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  h1 { font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; }
  h2 { font-size: 16px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-soft); margin: 6px 0 24px; font-size: 14.5px; }

  /* ============================================================
     Messages
     ============================================================ */
  .error, .success {
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
    font-size: 14px; display: flex; gap: 8px; align-items: flex-start;
  }
  .error   { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .success { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }

  /* ============================================================
     Forms
     ============================================================ */
  form { display: flex; flex-direction: column; gap: 12px; }

  .field { position: relative; }
  .field svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: #94a3b8; pointer-events: none;
  }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 12px 14px 12px 42px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    background: #f8fafc; font-size: 14.5px; color: var(--text);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus {
    outline: none; border-color: var(--accent); background: #fff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  }

  button.btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; padding: 12px 16px; margin-top: 4px;
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 14.5px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    background-size: 150% 150%;
    box-shadow: 0 10px 22px -8px rgba(79, 70, 229, 0.65);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  button.btn:hover  { transform: translateY(-1px); filter: brightness(1.06); }
  button.btn:active { transform: translateY(0); filter: brightness(0.97); }
  button.btn.ghost {
    background: #fff; color: var(--accent-strong);
    border: 1.5px solid #e2e8f0; box-shadow: none;
  }
  button.btn.ghost:hover { border-color: var(--accent); background: #f5f6ff; filter: none; }

  /* ============================================================
     Links
     ============================================================ */
  .link-row { margin-top: 18px; text-align: center; font-size: 14px; color: var(--text-soft); }
  .link-row a { color: var(--accent-strong); font-weight: 600; text-decoration: none; }
  .link-row a:hover { text-decoration: underline; }

  /* ============================================================
     App navigation (internal pages)
     ============================================================ */
  .nav {
    display: flex; align-items: center; gap: 18px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    color: #e2e8f0;
    padding: 14px 20px; border-radius: var(--radius);
    margin-bottom: 20px;
    animation: rise .45s cubic-bezier(.21,.8,.35,1) both;
  }
  .nav .who {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; margin-right: auto;
  }
  .nav .avatar {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; }
  .nav a:hover { color: #fff; }
  .nav a.active { color: #fff; }
  .nav .logout {
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: #fecaca; background: rgba(220, 38, 38, 0.14);
    border: 1px solid rgba(220, 38, 38, 0.25);
    transition: background .15s, color .15s;
  }
  .nav .logout:hover { background: rgba(220, 38, 38, 0.28); color: #fff; }

  /* ============================================================
     Info grid / badges
     ============================================================ */
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0;
  }
  .info-item {
    background: #f8fafc; border: 1px solid #eef2f7; border-radius: 12px;
    padding: 16px 14px; text-align: center;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .info-item:hover {
    transform: translateY(-2px); border-color: #dfe7f2;
    box-shadow: var(--shadow-sm);
  }
  .info-item .label { color: var(--text-soft); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .info-item .value { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .value.ok { color: var(--green); }

  .action-row {
    display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
  }
  .action-row a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; background: #f8fafc; border: 1px solid #eef2f7;
    border-radius: 12px; text-decoration: none; color: var(--text);
    font-size: 14.5px; font-weight: 500;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .action-row a:hover {
    transform: translateX(2px); border-color: #c7d2fe;
    box-shadow: var(--shadow-sm);
  }
  .action-row a .arrow { color: var(--accent-strong); font-weight: 700; }

  /* ============================================================
     Footer
     ============================================================ */
  @media (max-width: 520px) {
    .container { margin: 24px auto; }
    .card { padding: 24px; }
    .info-grid { grid-template-columns: 1fr 1fr; }
    .nav { flex-wrap: wrap; gap: 10px; }
  }
</style>
</head>
<body>
<div class="container{% block wide %}{% endblock %}">
  {% block brand %}
  <div class="brand">
    <span class="logo">⚡</span>
    <span>Employee Portal</span>
  </div>
  {% endblock %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
