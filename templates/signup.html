{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="card">
  <h1>Create Account</h1>
  <p class="subtitle">Register a new employee account.</p>

  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}

  <form method="POST" action="/signup">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <input type="text" name="username" placeholder="Username" required autocomplete="username">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" name="password" placeholder="Password (min 3 chars)" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn">Create Account</button>
    <button type="button" class="btn ghost" onclick="location.href='/login'">I already have an account</button>
  </form>
</div>
{% endblock %}
